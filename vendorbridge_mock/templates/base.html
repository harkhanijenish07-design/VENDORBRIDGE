<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}VendorBridge{% endblock %}</title>
    <meta name="description" content="VendorBridge — Procurement & Vendor Management ERP">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-purple: #714B67;
            --primary-purple-hover: #5c3e55;
            --primary-purple-light: #f3eaf0;
            --secondary-teal: #017e84;
            --secondary-teal-hover: #015e62;
            --secondary-teal-light: #e6f5f5;
            --bg-gradient: linear-gradient(135deg, #f6f8fb 0%, #eef1f6 100%);
            --sidebar-bg: #fafbfc;
            --glass-bg: rgba(255, 255, 255, 0.92);
            --glass-border: rgba(255, 255, 255, 0.6);
            --text-dark: #2d3748;
            --text-muted: #718096;
            --text-light: #a0aec0;
            --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.03);
            --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.02);
            --shadow-md: 0 10px 25px rgba(31, 38, 135, 0.04);
            --shadow-lg: 0 15px 35px rgba(31, 38, 135, 0.08);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --sidebar-width: 240px;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-dark);
            min-height: 100vh;
            margin: 0;
            display: flex;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
        }

        /* ── Sidebar ── */
        .sidebar {
            width: var(--sidebar-width);
            min-height: 100vh;
            background: var(--sidebar-bg);
            border-right: 1px solid rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100;
            transition: transform 0.3s ease;
        }

        .sidebar-brand {
            padding: 24px 20px 20px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .sidebar-brand a {
            font-family: 'Outfit', sans-serif;
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--primary-purple);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.5px;
        }

        .sidebar-brand a:hover { opacity: 0.9; }

        .sidebar-nav {
            padding: 16px 12px;
            flex: 1;
            overflow-y: auto;
        }

        .sidebar-nav .nav-section {
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--text-light);
            padding: 12px 12px 6px;
            margin-top: 8px;
        }

        .sidebar-nav .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            margin: 2px 0;
            border-radius: var(--radius-sm);
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.88rem;
            text-decoration: none;
            transition: all 0.2s ease;
            position: relative;
        }

        .sidebar-nav .nav-link i {
            font-size: 1.1rem;
            width: 20px;
            text-align: center;
        }

        .sidebar-nav .nav-link:hover {
            background: rgba(1, 126, 132, 0.06);
            color: var(--secondary-teal);
        }

        .sidebar-nav .nav-link.active {
            background: var(--secondary-teal-light);
            color: var(--secondary-teal);
            font-weight: 600;
        }

        .sidebar-nav .nav-link.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 6px;
            bottom: 6px;
            width: 3px;
            background: var(--secondary-teal);
            border-radius: 0 3px 3px 0;
        }

        /* ── Main wrapper ── */
        .main-wrapper {
            margin-left: var(--sidebar-width);
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ── Top bar ── */
        .topbar {
            height: 60px;
            background: var(--glass-bg);
            border-bottom: 1px solid rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 0 28px;
            gap: 16px;
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .topbar-icon {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            background: transparent;
            border: none;
        }

        .topbar-icon:hover {
            background: rgba(0,0,0,0.04);
            color: var(--text-dark);
        }

        .topbar-icon .notif-dot {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 8px;
            height: 8px;
            background: #ff5964;
            border-radius: 50%;
            border: 2px solid white;
        }

        .topbar-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-purple), #9b6e90);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
        }

        /* ── Content ── */
        .page-content {
            padding: 28px;
            flex: 1;
        }

        /* ── Reusable components ── */
        .btn {
            font-weight: 500;
            border-radius: var(--radius-sm);
            padding: 0.55rem 1.3rem;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            font-family: 'Outfit', sans-serif;
            font-size: 0.88rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--secondary-teal) 0%, #009399 100%);
            border: none;
            box-shadow: 0 4px 12px rgba(1, 126, 132, 0.2);
            color: white;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, var(--secondary-teal-hover) 0%, var(--secondary-teal) 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(1, 126, 132, 0.3);
            color: white;
        }

        .btn-outline-primary {
            color: var(--secondary-teal);
            border-color: var(--secondary-teal);
        }
        .btn-outline-primary:hover {
            background: var(--secondary-teal);
            border-color: var(--secondary-teal);
            color: white;
            transform: translateY(-1px);
        }

        .btn-outline-secondary {
            border-color: #cbd5e0;
            color: #4a5568;
        }
        .btn-outline-secondary:hover {
            background: #f7fafc;
            border-color: #a0aec0;
            color: #2d3748;
        }

        .btn-success {
            background: linear-gradient(135deg, #2ec4b6, #0f9f90);
            border: none;
            color: white;
        }
        .btn-danger {
            background: linear-gradient(135deg, #ff5964, #d8313d);
            border: none;
            color: white;
        }

        .form-control, .form-select {
            border: 1px solid #e2e8f0;
            border-radius: var(--radius-sm);
            padding: 0.6rem 0.9rem;
            transition: all 0.2s ease;
            background-color: #fcfdfd;
            font-size: 0.9rem;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--secondary-teal);
            box-shadow: 0 0 0 3px rgba(1, 126, 132, 0.12);
            background-color: #fff;
            outline: none;
        }

        .card {
            border: 1px solid rgba(0,0,0,0.06);
            background: white;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-xs);
            transition: all 0.25s ease;
            overflow: hidden;
        }
        .card:hover { box-shadow: var(--shadow-md); }

        .table {
            --bs-table-bg: transparent;
            margin-bottom: 0;
            font-size: 0.9rem;
        }
        thead th {
            background-color: #f8f9fa !important;
            border-bottom: 2px solid rgba(0,0,0,0.05);
            text-transform: uppercase;
            font-size: 0.72rem;
            letter-spacing: 0.6px;
            color: var(--text-muted);
            font-weight: 700;
            padding: 12px 16px;
        }
        tbody td { padding: 12px 16px; vertical-align: middle; }

        .badge {
            padding: 0.35em 0.7em;
            font-size: 0.72em;
            font-weight: 600;
            border-radius: 5px;
        }
        .bg-success { background: linear-gradient(135deg, #2ec4b6, #0f9f90) !important; }
        .bg-warning { background: linear-gradient(135deg, #ff9f1c, #e07a00) !important; color: white !important; }
        .bg-danger  { background: linear-gradient(135deg, #ff5964, #d8313d) !important; }
        .bg-info    { background: linear-gradient(135deg, #3a86c8, #20639b) !important; }
        .bg-secondary { background: linear-gradient(135deg, #94a3b8, #64748b) !important; }
        .bg-purple { background: linear-gradient(135deg, var(--primary-purple), #9b6e90) !important; color: white; }

        /* Stat cards */
        .stat-card {
            border-radius: var(--radius-md);
            padding: 20px 24px;
            background: white;
            border: 1px solid rgba(0,0,0,0.05);
            transition: all 0.3s ease;
        }
        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
        }
        .stat-card .stat-icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }
        .stat-card .stat-value {
            font-family: 'Outfit', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            line-height: 1.1;
        }
        .stat-card .stat-label {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        /* Page header */
        .page-header {
            margin-bottom: 24px;
        }
        .page-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .page-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 0;
        }

        /* Filter pills */
        .filter-pills .btn {
            font-size: 0.82rem;
            padding: 0.4rem 1rem;
            border-radius: 20px;
        }
        .filter-pills .btn.active {
            background: var(--secondary-teal);
            color: white;
            border-color: var(--secondary-teal);
        }

        /* Timeline */
        .timeline-item {
            display: flex;
            gap: 14px;
            padding: 16px 0;
            border-bottom: 1px solid rgba(0,0,0,0.04);
        }
        .timeline-item:last-child { border-bottom: none; }
        .timeline-dot {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        /* Stepper */
        .stepper {
            display: flex;
            align-items: center;
            gap: 0;
            margin-bottom: 28px;
        }
        .stepper-step {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
        }
        .stepper-step.active { color: var(--secondary-teal); font-weight: 600; }
        .stepper-step.done { color: #2ec4b6; }
        .stepper-circle {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 700;
            border: 2px solid #e2e8f0;
            background: white;
            color: var(--text-muted);
        }
        .stepper-step.active .stepper-circle {
            border-color: var(--secondary-teal);
            background: var(--secondary-teal);
            color: white;
        }
        .stepper-step.done .stepper-circle {
            border-color: #2ec4b6;
            background: #2ec4b6;
            color: white;
        }
        .stepper-line {
            flex: 1;
            height: 2px;
            background: #e2e8f0;
            margin: 0 8px;
        }
        .stepper-line.done { background: #2ec4b6; }

        /* Mobile toggle */
        .sidebar-toggle {
            display: none;
            position: fixed;
            top: 14px;
            left: 14px;
            z-index: 200;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: white;
            border: 1px solid rgba(0,0,0,0.1);
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .sidebar-toggle { display: flex; }
            .main-wrapper { margin-left: 0; }
        }

        /* Standalone / No-sidebar pages */
        body.no-sidebar {
            background: linear-gradient(135deg, #f6f8fb 0%, #eef1f6 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        body.no-sidebar .sidebar { display: none !important; }
        body.no-sidebar .sidebar-toggle { display: none !important; }
        body.no-sidebar .main-wrapper { margin-left: 0 !important; width: 100%; max-width: 100%; min-height: auto; }
        body.no-sidebar .topbar { display: none !important; }
        body.no-sidebar .page-content { padding: 0; display: flex; justify-content: center; align-items: center; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="{% if no_sidebar %}no-sidebar{% endif %}">

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
        <a href="/dashboard"><i class="bi bi-link-45deg"></i> VendorBridge</a>
    </div>
    <nav class="sidebar-nav">
        <a href="/dashboard" class="nav-link {% if active_page == 'dashboard' %}active{% endif %}" id="nav-dashboard">
            <i class="bi bi-grid-1x2"></i> Dashboard
        </a>
        <a href="/vendors" class="nav-link {% if active_page == 'vendors' %}active{% endif %}" id="nav-vendors">
            <i class="bi bi-people"></i> Vendors
        </a>
        <a href="/rfqs" class="nav-link {% if active_page == 'rfqs' %}active{% endif %}" id="nav-rfqs">
            <i class="bi bi-file-earmark-text"></i> RFQ's
        </a>
        <a href="/quotations" class="nav-link {% if active_page == 'quotations' %}active{% endif %}" id="nav-quotations">
            <i class="bi bi-chat-square-text"></i> Quotations
        </a>
        <a href="/approvals" class="nav-link {% if active_page == 'approvals' %}active{% endif %}" id="nav-approvals">
            <i class="bi bi-check2-square"></i> Approvals
        </a>
        <a href="/purchase-orders" class="nav-link {% if active_page == 'purchase_orders' %}active{% endif %}" id="nav-pos">
            <i class="bi bi-cart-check"></i> Purchase Orders
        </a>
        <a href="/invoices" class="nav-link {% if active_page == 'invoices' %}active{% endif %}" id="nav-invoices">
            <i class="bi bi-receipt"></i> Invoices
        </a>
        <a href="/reports" class="nav-link {% if active_page == 'reports' %}active{% endif %}" id="nav-reports">
            <i class="bi bi-bar-chart-line"></i> Reports
        </a>
        <a href="/activity" class="nav-link {% if active_page == 'activity' %}active{% endif %}" id="nav-activity">
            <i class="bi bi-clock-history"></i> Activity
        </a>
    </nav>
</aside>

<!-- Mobile toggle -->
<button class="sidebar-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">
    <i class="bi bi-list" style="font-size:1.2rem"></i>
</button>

<!-- Main -->
<div class="main-wrapper">
    <header class="topbar">
        <button class="topbar-icon" title="Notifications">
            <i class="bi bi-bell" style="font-size:1.15rem"></i>
            <span class="notif-dot"></span>
        </button>
        <div class="topbar-avatar" title="Procurement Officer">
            PO
        </div>
    </header>

    <main class="page-content">
        {% block content %}{% endblock %}
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
