{% extends "base.html" %}

{% block title %}Register - VendorBridge{% endblock %}

{% block content %}
<div class="row justify-content-center w-100 py-4">
    <div class="col-lg-8 col-xl-6">
        <div class="card border-0 shadow-lg" style="background: rgba(255, 255, 255, 0.95); border-radius: var(--radius-lg);">
            <div class="card-body p-5">
                <div class="text-center mb-5">
                    <!-- Photo placeholder circle at top -->
                    <div class="position-relative d-inline-block mb-3">
                        <div class="rounded-circle bg-light d-flex align-items-center justify-content-center border" style="width: 100px; height: 100px; overflow: hidden; border-width: 2px !important;">
                            <i class="bi bi-person-fill text-muted" style="font-size: 3.5rem;"></i>
                        </div>
                        <span class="position-absolute bottom-0 end-0 bg-secondary-teal text-white rounded-circle p-2 d-flex align-items-center justify-content-center" style="width: 30px; height: 30px; background-color: var(--secondary-teal); cursor: pointer;" title="Upload Photo">
                            <i class="bi bi-camera" style="font-size: 0.85rem;"></i>
                        </span>
                    </div>
                    <h2 class="h3 fw-bold mb-2">Create Account</h2>
                    <p class="text-muted">Register as a procurement officer or administrator</p>
                </div>

                <form action="/api/signup" method="POST" class="needs-validation">
                    <div class="row g-4 mb-4">
                        <div class="col-md-6">
                            <label for="first_name" class="form-label fw-semibold text-secondary">First Name *</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                                <input type="text" class="form-control border-start-0 ps-0" id="first_name" name="first_name" placeholder="John" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label for="last_name" class="form-label fw-semibold text-secondary">Last Name *</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                                <input type="text" class="form-control border-start-0 ps-0" id="last_name" name="last_name" placeholder="Doe" required>
                            </div>
                        </div>
                    </div>

                    <div class="row g-4 mb-4">
                        <div class="col-md-6">
                            <label for="email" class="form-label fw-semibold text-secondary">Email Address *</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                                <input type="email" class="form-control border-start-0 ps-0" id="email" name="email" placeholder="john.doe@vendorbridge.com" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label for="phone" class="form-label fw-semibold text-secondary">Phone Number *</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-telephone text-muted"></i></span>
                                <input type="text" class="form-control border-start-0 ps-0" id="phone" name="phone" placeholder="+91 98765 43210" required>
                            </div>
                        </div>
                    </div>

                    <div class="row g-4 mb-4">
                        <div class="col-md-6">
                            <label for="role" class="form-label fw-semibold text-secondary">Role *</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-person-badge text-muted"></i></span>
                                <select class="form-select border-start-0 ps-0" id="role" name="role" required>
                                    <option value="officer" selected>Procurement Officer</option>
                                    <option value="admin">Administrator</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label for="country" class="form-label fw-semibold text-secondary">Country *</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-globe text-muted"></i></span>
                                <select class="form-select border-start-0 ps-0" id="country" name="country" required>
                                    <option value="India" selected>India</option>
                                    <option value="United States">United States</option>
                                    <option value="United Kingdom">United Kingdom</option>
                                    <option value="Singapore">Singapore</option>
                                    <option value="Germany">Germany</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold text-secondary">Password *</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-key text-muted"></i></span>
                            <input type="password" class="form-control border-start-0 ps-0" id="password" name="password" placeholder="••••••••" required>
                        </div>
                    </div>

                    <!-- Expandable Additional Information -->
                    <div class="accordion mb-4" id="additionalInfoAccordion">
                        <div class="accordion-item border border-light-subtle rounded">
                            <h2 class="accordion-header">
                                <button class="accordion-button collapsed fw-semibold text-secondary bg-light py-2" type="button" data-bs-toggle="collapse" data-bs-target="#collapseInfo" aria-expanded="false" aria-controls="collapseInfo">
                                    <i class="bi bi-plus-circle me-2"></i> Additional Information
                                </button>
                            </h2>
                            <div id="collapseInfo" class="accordion-collapse collapse" data-bs-parent="#additionalInfoAccordion">
                                <div class="accordion-body bg-white">
                                    <div class="mb-3">
                                        <label for="department" class="form-label fw-semibold text-secondary">Department</label>
                                        <input type="text" class="form-control" id="department" name="department" placeholder="Sourcing & Logistics">
                                    </div>
                                    <div class="mb-0">
                                        <label for="employee_id" class="form-label fw-semibold text-secondary">Employee ID</label>
                                        <input type="text" class="form-control" id="employee_id" name="employee_id" placeholder="EMP-2025-08">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="d-grid mt-5">
                        <button type="submit" class="btn btn-primary btn-lg py-3 fw-bold text-uppercase tracking-wider">
                            <i class="bi bi-check-circle me-2"></i>Register
                        </button>
                    </div>
                </form>
                
                <div class="text-center mt-4 text-muted">
                    <p class="small mb-0">Already have an account? <a href="/login" class="text-decoration-none fw-semibold" style="color: var(--secondary-teal);">Login here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
