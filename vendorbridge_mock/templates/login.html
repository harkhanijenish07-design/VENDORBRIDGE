{% extends "base.html" %}

{% block title %}Login - VendorBridge{% endblock %}

{% block content %}
<div class="row justify-content-center w-100">
    <div class="col-md-6 col-lg-4">
        <div class="card border-0 shadow-lg" style="background: rgba(255, 255, 255, 0.95); border-radius: var(--radius-lg);">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center bg-light rounded-circle mb-3" style="width: 80px; height: 80px; border: 2px dashed var(--secondary-teal);">
                        <i class="bi bi-shield-lock text-primary" style="font-size: 2.2rem; color: var(--secondary-teal) !important;"></i>
                    </div>
                    <h2 class="h3 fw-bold mb-2">VendorBridge</h2>
                    <p class="text-muted">Procurement & Vendor Portal</p>
                </div>

                {% if error %}
                <div class="alert alert-danger d-flex align-items-center" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <div>{{ error }}</div>
                </div>
                {% endif %}

                <form action="/api/login" method="POST">
                    <div class="mb-4">
                        <label for="username" class="form-label fw-semibold text-secondary">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                            <input type="email" class="form-control border-start-0 ps-0" id="username" name="username" placeholder="officer@vendorbridge.com" required>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <label for="password" class="form-label fw-semibold text-secondary mb-0">Password</label>
                            <a href="#" class="text-decoration-none text-muted small">Forgot?</a>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-key text-muted"></i></span>
                            <input type="password" class="form-control border-start-0 ps-0" id="password" name="password" placeholder="••••••••" required>
                        </div>
                    </div>

                    <div class="mb-4 form-check">
                        <input type="checkbox" class="form-check-input" id="remember">
                        <label class="form-check-label text-muted small" for="remember">Keep me logged in</label>
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary btn-lg py-3 fw-bold text-uppercase tracking-wider">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Login
                        </button>
                    </div>
                </form>
                
                <div class="text-center mt-4 text-muted">
                    <p class="small mb-0">Don't have an account? <a href="/vendor/signup" class="text-decoration-none fw-semibold" style="color: var(--secondary-teal);">Register Vendor</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
